<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="하투 냉장고" />
<meta name="description" content="하투 냉장고 — 영수증 한 장이면 끝나는 우리 집 냉장고 재고 관리" />
<title>하투 냉장고</title>

<!-- 홈화면 추가용 아이콘 (소프트 코랄 바탕 + 화이트 양문형 냉장고) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23EE8A74'/%3E%3Crect x='17.6' y='11' width='28.8' height='42' rx='3' fill='%23FFFFFF'/%3E%3Crect x='31.6' y='11' width='0.9' height='33.2' fill='%23EE8A74'/%3E%3Crect x='17.6' y='43.3' width='28.8' height='0.9' fill='%23EE8A74'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
:root{
  /* 바탕 — 퓨어 화이트 & 쿨 그레이 */
  --milk:#FFFFFF;
  --cream:#FFFFFF;
  --cream-2:#F6F7F8;
  --cream-3:#F1F2F4;
  --line:#EAECEF;
  --line-2:#F1F2F4;
  --hair:#EFF1F4;

  /* 글자 — 선명한 딥 차콜 */
  --ink:#18181B;
  --ink-2:#5F646B;
  --ink-3:#9AA0A6;

  /* 포인트 — 소프트 코랄 (홈화면 아이콘과 한 세트) */
  --coral:#EE8A74;        /* 아이콘 바탕과 같은 소프트 코랄 */
  --coral-btn:#DE7258;    /* 버튼·칩·탭 (흰 글자 대비 확보) */
  --coral-deep:#C2593F;   /* 눌림·강조 글자 */
  --coral-soft:#FDEDE8;   /* 은은한 코랄 배경 */
  --coral-line:#F8DCD3;
  --coral-glow:rgba(222,114,88,.20);
  --coral-shadow:rgba(222,114,88,.55);

  /* 유통기한 임박(D-3 이내)만 은은한 코랄레드 */
  --red:#EF4444;
  --red-soft:#FEF2F2;

  --radius:20px;
  --radius-lg:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.03);
  --shadow-md:0 14px 34px -14px rgba(0,0,0,.16);
  --nav-h:68px;
  --pad:20px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#F6F7F8;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
  display:flex;
  justify-content:center;
  min-height:100dvh;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
input,select{font-family:inherit;font-size:16px;color:inherit;letter-spacing:inherit}
::selection{background:#FBE3DC;color:#18181B}

/* ── 폰 프레임 ───────────────────────────── */
.phone{
  width:100%;
  max-width:430px;
  min-height:100dvh;
  background:var(--cream);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 80px rgba(0,0,0,.06);
}
@media (min-width:520px){
  .phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ── 헤더 ───────────────────────────── */
.app-header{
  position:sticky;top:0;z-index:40;
  padding:calc(15px + env(safe-area-inset-top)) var(--pad) 12px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:box-shadow .2s ease;
}
.app-header.scrolled{
  box-shadow:0 1px 0 var(--line), 0 8px 22px -20px rgba(0,0,0,.5);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:var(--coral);display:grid;place-items:center;
  box-shadow:0 3px 8px -3px rgba(238,138,116,.55);
}
.brand-mark svg{width:36px;height:36px;display:block}
.brand-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.app-title{
  font-size:19px;font-weight:800;letter-spacing:-0.045em;line-height:1.15;
  display:flex;align-items:center;gap:5px;
}
.app-sub{
  font-size:11px;color:var(--ink-3);letter-spacing:0.01em;
  display:flex;align-items:center;gap:4px;
}
.app-sub::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--coral);flex:none;
  box-shadow:0 0 0 3px rgba(238,138,116,.18);
}
.share-pill{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:7px 11px 7px 9px;border-radius:999px;
  background:var(--milk);border:1px solid var(--line);
  font-size:11px;color:var(--ink-2);font-weight:600;box-shadow:var(--shadow-sm);
  white-space:nowrap;
}
.share-pill .dot{
  width:6px;height:6px;border-radius:50%;background:var(--coral-btn);flex:none;
  box-shadow:0 0 0 0 rgba(222,114,88,.35);animation:pulse 2.4s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(222,114,88,.32)}
  70%{box-shadow:0 0 0 6px rgba(222,114,88,0)}
  100%{box-shadow:0 0 0 0 rgba(222,114,88,0)}
}
.share-pill b{font-weight:700;color:var(--ink)}
.share-pill .heart{color:var(--ink-3);font-size:9px}

/* ── 본문 ───────────────────────────── */
.screen{flex:1;display:flex;flex-direction:column;padding:16px var(--pad) calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));animation:fade .28s ease both}
.screen[hidden]{display:none}
#screen-meal,#screen-shop{padding-top:4px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 요약 위젯 */
.summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin:0 0 14px;
}
.stat{
  background:var(--milk);border:1px solid var(--line);border-radius:18px;
  padding:11px 12px 12px;box-shadow:var(--shadow-sm);text-align:left;
  display:flex;flex-direction:column;gap:7px;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.stat:active{transform:scale(.975)}
.stat .k{
  font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:-0.01em;
  display:flex;align-items:center;gap:5px;
}
.stat .ico{
  width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
  flex:none;line-height:1;background:var(--cream-2);color:var(--ink-2);
}
.stat .ico svg{width:13px;height:13px;display:block}
.stat .ico.i-all,.stat .ico.i-soon,.stat .ico.i-exp{background:var(--cream-2)}
.stat.is-on .ico{background:var(--coral-btn);color:#FFF}
.stat .v{
  font-size:21px;font-weight:800;letter-spacing:-0.05em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.stat .v small{font-size:10.5px;font-weight:600;color:var(--ink-3);margin-left:2px;letter-spacing:0}
.stat.warn .v{color:var(--ink)}
.stat.muted .v{color:var(--ink-3)}
.stat.is-on{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-glow)}

/* 검색 */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search{
  width:100%;height:46px;border-radius:16px;border:1px solid var(--line);
  background:var(--milk);padding:0 40px 0 40px;font-size:14px;outline:none;
  transition:border-color .16s, box-shadow .16s;-webkit-appearance:none;appearance:none;
  box-shadow:var(--shadow-sm);
}
.search::-webkit-search-cancel-button,.search::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search::placeholder{color:var(--ink-3)}
.search:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-glow)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--ink-3);background:var(--cream-2)}
.search-clear.show{display:grid}

/* 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 calc(var(--pad) * -1) 12px;padding:1px var(--pad) 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:35px;padding:0 17px;border-radius:999px;border:1px solid var(--line);
  background:var(--milk);font-size:12.5px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;transition:all .16s ease;
  box-shadow:var(--shadow-sm);
}
.chip:active{transform:scale(.96)}
.chip.on{
  background:var(--coral-btn);border-color:var(--coral-btn);color:#FFF;font-weight:700;
  box-shadow:0 6px 14px -8px var(--coral-shadow);
}
.chip .n{font-size:10.5px;opacity:.62;font-weight:700;font-variant-numeric:tabular-nums}
.chip.on .n{opacity:.72}
.sort-btn{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);font-weight:600;
  padding:5px 2px;transition:color .15s;
}
.sort-btn:active{color:var(--ink)}
.sort-btn.on{color:var(--ink-2)}

/* 재고 카드 */
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding:0 2px}
.list-head h2{font-size:13px;font-weight:700;color:var(--ink-2);margin:0;letter-spacing:-0.02em}
.list-head span{font-size:11px;color:var(--ink-3)}

.inv-list{display:flex;flex-direction:column;gap:8px}

/* 빈 화면은 남는 공간 가운데에 */
.inv-list:has(> .empty),#mealList:has(> .empty),#shopList:has(> .empty){
  flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:36px;
}
.item{
  background:var(--milk);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px 11px;box-shadow:var(--shadow-sm);position:relative;
  transition:opacity .25s ease, transform .25s ease;
}
.item.done{opacity:.45}
.item-main{display:flex;align-items:center;gap:11px}
.item-icon{
  width:44px;height:44px;border-radius:15px;flex:none;
  display:grid;place-items:center;font-size:21px;line-height:1;
  background:var(--cream-2);border:1px solid var(--hair);
  filter:grayscale(1);
}
.item-icon svg{width:23px;height:23px;display:block}
.item-info{flex:1;min-width:0}
.item-name{
  font-size:15px;font-weight:700;letter-spacing:-0.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;
}
.item-meta{
  font-size:11.5px;color:var(--ink-3);margin-top:4px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.3;
}
.item-meta .sep{width:2.5px;height:2.5px;border-radius:50%;background:#D3D7DD;flex:none}
.loc-tag{
  flex:none;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:0;
  background:var(--cream-2);color:var(--ink-2);
}
.loc-냉장{background:var(--cream-2);color:var(--ink-2)}
.loc-냉동{background:#E7E9EC;color:#18181B}
.loc-실온{background:#FFF;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.badge{
  flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums;
}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--cream-2);color:var(--ink-2)}
.badge.green{background:#FFF;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.badge.expired{background:var(--cream-3);color:var(--ink-3)}
.item-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--cream-2);border-radius:999px;padding:3px}
.stepper button{
  width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  font-size:16px;font-weight:600;transition:background .14s, transform .14s;
}
.stepper button:active{transform:scale(.9);background:#FFF}
.stepper button:disabled{opacity:.25}
.stepper .qty{
  min-width:36px;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.stepper .qty small{font-size:10px;font-weight:600;color:var(--ink-3);margin-left:1px}
.btn-done{
  font-size:11.5px;font-weight:700;color:var(--ink-2);padding:8px 13px;border-radius:999px;
  background:var(--cream-2);transition:all .15s;
}
.btn-done:active{background:var(--coral-soft);color:var(--coral-deep);transform:scale(.96)}

/* 빈 상태 */
.empty{text-align:center;padding:36px 18px;color:var(--ink-3)}
.empty .emo{
  width:64px;height:64px;border-radius:21px;background:var(--coral-soft);margin:0 auto 15px;
  display:grid;place-items:center;line-height:1;color:var(--coral-deep);
  border:1px solid var(--coral-line);
}
.empty .emo svg{width:27px;height:27px;display:block}
.empty b{
  display:block;font-size:14.5px;font-weight:800;color:var(--ink);
  letter-spacing:-0.035em;margin-bottom:7px;
}
.empty p{margin:0;font-size:12.5px;line-height:1.75;word-break:keep-all}
.empty p b{display:inline;font-size:inherit;font-weight:700;color:var(--ink-2);letter-spacing:inherit;margin:0}

/* ── 식단 탭 ───────────────────────────── */
.tab-intro{margin:2px 0 15px}
.tab-intro h2{font-size:20px;font-weight:800;letter-spacing:-0.045em;margin:0 0 6px}
.tab-intro p{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.65}
.tab-intro p b{color:var(--ink);font-weight:700}

.week-strip{display:flex;gap:6px;margin:0 calc(var(--pad) * -1) 14px;padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.week-strip[hidden]{display:none}
.week-strip::-webkit-scrollbar{display:none}
.day-pill{
  flex:none;width:44px;padding:8px 0 7px;border-radius:15px;background:var(--milk);
  border:1px solid var(--line);text-align:center;box-shadow:var(--shadow-sm);
}
.day-pill .d{font-size:11px;color:var(--ink-3);font-weight:600}
.day-pill .n{font-size:15px;font-weight:800;margin-top:1px;letter-spacing:-0.03em;color:var(--ink)}
.day-pill.today{background:var(--coral-btn);border-color:var(--coral-btn);box-shadow:0 6px 14px -8px var(--coral-shadow)}
.day-pill.today .d,.day-pill.today .n{color:#FFF}

.meal{
  background:var(--milk);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden;
  transition:box-shadow .2s ease, border-color .2s ease;
}
.meal.open{box-shadow:var(--shadow-md);border-color:#DEE1E6}
.meal.today{border-color:#DEE1E6}
.meal-head{padding:14px 15px 13px;display:flex;gap:11px;align-items:center;width:100%;text-align:left}
.day-badge{
  flex:none;width:42px;height:42px;border-radius:14px;background:var(--cream-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
}
.day-badge .d{font-size:11.5px;font-weight:800;color:var(--ink-2)}
.day-badge .dt{font-size:9px;color:var(--ink-3);margin-top:2px;letter-spacing:-0.02em;font-weight:600}
.meal.today .day-badge{background:var(--coral-btn)}
.meal.today .day-badge .d{color:#FFF}
.meal.today .day-badge .dt{color:rgba(255,255,255,.7)}
.meal-main{flex:1;min-width:0}
.meal-kids{
  font-size:14.5px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;color:var(--ink);
  display:flex;align-items:flex-start;gap:5px;
}
.meal-kids .menu-emo{font-size:14px;line-height:1.35;flex:none;filter:grayscale(1)}
.meal-adult{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;align-items:center;gap:5px;line-height:1.35}
.meal-adult .tag{
  font-size:9px;font-weight:800;color:var(--ink-2);background:var(--cream-2);
  padding:2px 5px;border-radius:5px;flex:none;letter-spacing:0;
}
.meal-side{flex:none;display:flex;align-items:center;gap:4px}
.match-badge{
  font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;
  background:var(--cream-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.match-badge.low{background:#FFF;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.chev{color:var(--ink-3);transition:transform .25s ease;display:grid;place-items:center}
.meal.open .chev{transform:rotate(180deg);color:var(--ink)}

.meal-body{display:none;padding:0 15px 15px}
.meal.open .meal-body{display:block;animation:slide .25s ease both}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.ing-block{margin-top:0}
.ing-title{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:0.01em;margin:0 0 7px}
.ing-row{display:flex;flex-wrap:wrap;gap:5px}
.ing{
  font-size:11.5px;padding:5px 9px;border-radius:9px;display:inline-flex;align-items:center;gap:4px;
  background:var(--cream-2);color:var(--ink-2);font-weight:600;
}
.ing.have{background:var(--cream-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ing.have::before{content:"✓";font-size:9px;opacity:.7}
.ing.need{background:#FFF;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.ing.need::before{content:"+";font-size:11px;opacity:.7;font-weight:800}
.divider{height:1px;background:var(--line-2);margin:13px 0 11px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{
  position:relative;padding-left:25px;font-size:12.5px;line-height:1.65;color:var(--ink-2);
  margin-bottom:7px;
}
.steps li:last-child{margin-bottom:0}
.steps li::before{
  counter-increment:s;content:counter(s);
  position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
  background:var(--coral-btn);color:#FFF;font-size:9.5px;font-weight:800;
  display:grid;place-items:center;
}
.meal-tip{
  margin-top:12px;background:var(--cream-2);border-radius:13px;padding:10px 12px;font-size:11.5px;
  color:var(--ink-2);line-height:1.6;display:flex;gap:7px;
}
.meal-tip span:first-child{filter:grayscale(1)}
.meal-tip b{color:var(--ink);font-weight:700}
.meal-foot{display:flex;gap:8px;margin-top:12px}
.btn-soft{
  flex:1;height:40px;border-radius:999px;background:var(--cream-2);font-size:12px;font-weight:700;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;
}
.btn-soft:active{transform:scale(.97);background:#E9EBEE}
.btn-soft.primary{background:var(--coral-btn);color:#FFF}
.btn-soft.primary:active{background:var(--coral-deep)}

/* ── 장보기 탭 ───────────────────────────── */
.shop-add{display:flex;gap:8px;margin-bottom:15px}
.shop-add input{
  flex:1;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--milk);
  padding:0 15px;font-size:14px;outline:none;min-width:0;box-shadow:var(--shadow-sm);
}
.shop-add input::placeholder{color:var(--ink-3)}
.shop-add input:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-glow)}
.btn-add{

}
.btn-add:active{transform:scale(.93)}

.shop-group{margin-bottom:16px}
.shop-group h3{

}
.shop-group h3 span{font-weight:600;color:#B4B9C0}
.shop-card{background:var(--milk);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.shop-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line-2)}
.shop-row:last-child{border-bottom:0}
.check{

}
.check svg{width:12px;height:12px;color:#FFF;opacity:0;transform:scale(.6);transition:all .16s ease}
.shop-row.checked .check{background:var(--coral-btn);border-color:var(--coral-btn)}
.shop-row.checked .check svg{opacity:1;transform:none}
.shop-name{flex:1;font-size:14px;font-weight:600;min-width:0;line-height:1.4}
.shop-row.checked .shop-name{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#C7CCD3}
.shop-from{

}

.shop-bar{
  position:fixed;left:50%;transform:translateX(-50%) translateY(130%);width:100%;max-width:430px;

}
.shop-bar.show{transform:translateX(-50%) translateY(0)}
.shop-bar button{
  width:100%;height:54px;border-radius:18px;

}
.shop-bar button .right{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:rgba(255,255,255,.72);font-weight:600}
.shop-bar button:active{transform:scale(.985)}

/* ── FAB ───────────────────────────── */
.fab{
  position:fixed;z-index:44;right:calc(50% - 215px + var(--pad));
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;

}
.fab svg{width:23px;height:23px}
.fab:active{transform:scale(.92)}
.fab.hide{opacity:0;pointer-events:none;transform:translateY(10px)}
@media (max-width:430px){ .fab{right:var(--pad)} }

/* ── 하단 네비 ───────────────────────────── */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;

.nav button.on .ico-wrap{background:var(--coral-btn)}
.nav button.on svg{color:#FFF;transform:translateY(-1px) scale(1.04)}
.nav .badge-dot[hidden]{display:none}
.nav .badge-dot{

/* ── 모달 ───────────────────────────── */
.scrim{

}

.sheet{

.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:999px;background:#E4E6EA;margin:2px auto 14px}
.sheet h2{font-size:17.5px;font-weight:800;letter-spacing:-0.035em;margin:0 0 4px}

.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{

.field select{

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}

</style>

<script>
/* =========================================================
   하투 냉장고 — 프로토타입
   데이터 계층은 StorageAdapter 하나로 모아두었습니다.
   실시간 공유(Firebase / Supabase / Sheets)로 바꿀 때는
   아래 어댑터의 5개 메서드만 교체하면 됩니다.
   ========================================================= */

/* ---------- 날짜 유틸 ---------- */
const DAY = 86400000;
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function ymd(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function addDays(d, n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function parseYMD(s){
  if(!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
function dday(expStr){
  const e = parseYMD(expStr); if(!e) return null;
  return Math.round((e.getTime() - today0().getTime()) / DAY);
}
function ddayLabel(n){
  if(n === null) return '';
  if(n < 0) return `만료 ${Math.abs(n)}일`;
  if(n === 0) return 'D-DAY';
  return `D-${n}`;
}
function shortDate(s){
  const d = parseYMD(s); if(!d) return '';
  return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;
}
const WD = ['일','월','화','수','목','금','토'];

/* ---------- 초기 샘플 (한국·아이 있는 집 기준) ---------- */
function seedInventory(){ return []; }
function seedShopping(){ return []; }
let _uidSeq = 0;
function uid(){ return 'i' + Date.now().toString(36) + (_uidSeq++).toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- StorageAdapter (localStorage + 원격 data/fridge.json) ----------
   삐클이가 GitHub(csh3787/Hatu_fridge)의 data/fridge.json 을 새로 올리면
   앱을 열 때(그리고 화면으로 돌아올 때) 원격 파일을 먼저 확인해서
   최신 재고·식단·장보기를 로컬에 합쳐 보여줍니다.
   원격 확인이 실패하거나 오프라인이면 조용히 localStorage 만 사용합니다.
   ---------------------------------------------------------------- */
const StorageAdapter = (() => {
  const KEY = 'hatwoo-fridge-v2';
  const REMOTE_URL = './data/fridge.json';
  const CHECK_GAP = 20000;     // 원격 확인 최소 간격(ms)
  const TOMB_MAX = 300;        // 기억해 둘 '지운 항목' id 최대 개수
  let memory = null;           // 로컬스토리지 차단 환경 폴백
  let listeners = [];
  let lastCheck = 0;
  let syncing = null;

  const nowIso = () => new Date().toISOString();
  function ts(v){ const t = Date.parse(v || ''); return isNaN(t) ? 0 : t; }

  function blank(){
    return {
      inventory: seedInventory(), shopping: seedShopping(), meals: [],
      updatedAt: nowIso(), lastSyncedAt: null,
      deletedIds: { inventory: [], shopping: [] },
      remoteSeen: { inventory: {}, shopping: {} },
      touched: {}
    };
  }
  // 예전 버전에서 저장된 상태도 그대로 쓸 수 있게 형태를 맞춰줍니다.
  function shape(s){
    if(!s || typeof s !== 'object') return blank();
    if(!Array.isArray(s.inventory)) s.inventory = [];
    if(!Array.isArray(s.shopping)) s.shopping = [];
    if(!Array.isArray(s.meals)) s.meals = [];
    if(!s.deletedIds || typeof s.deletedIds !== 'object') s.deletedIds = {};
    if(!Array.isArray(s.deletedIds.inventory)) s.deletedIds.inventory = [];
    if(!Array.isArray(s.deletedIds.shopping)) s.deletedIds.shopping = [];
    if(!s.remoteSeen || typeof s.remoteSeen !== 'object') s.remoteSeen = {};
    if(!s.remoteSeen.inventory || typeof s.remoteSeen.inventory !== 'object') s.remoteSeen.inventory = {};
    if(!s.remoteSeen.shopping || typeof s.remoteSeen.shopping !== 'object') s.remoteSeen.shopping = {};
    if(!s.touched || typeof s.touched !== 'object') s.touched = {};
    return s;
  }

  function read(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return shape(JSON.parse(raw));
    }catch(e){ /* 사파리 프라이빗 모드 등 */ }
    if(memory) return shape(memory);
    const init = blank();
    write(init);
    return init;
  }
  function write(state){
    state.updatedAt = nowIso();
    memory = state;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function emit(reason = 'local'){ listeners.forEach(fn => fn(reason)); }

  // 다른 기기/탭에서 바뀐 내용 반영 (실시간 공유의 로컬 버전)
  window.addEventListener('storage', (e) => {
    if(e.key !== KEY) return;
    memory = null;
    emit('remote');
  });

  /* ---- 원격 데이터 병합 ---- */
  function markTouch(s, id){ if(!s.touched) s.touched = {}; s.touched[id] = Date.now(); }

  // id 가 없는 원격 항목도 매번 같은 id 를 갖도록 이름·날짜로 만들어 줍니다.
  function remoteId(item, prefix){
    if(item && item.id) return String(item.id);
    const seed = String((item && item.name) || '') + '|' + String((item && (item.expiresAt || item.from || item.addedAt)) || '');
    let h = 0;
    for(let i = 0; i < seed.length; i++){ h = (h * 31 + seed.charCodeAt(i)) | 0; }
    return prefix + Math.abs(h).toString(36);
  }

  function normInv(r, id){
    return {
      id,
      name: String(r.name || '').trim(),
      amount: r.amount == null ? '' : String(r.amount),
      qty: Math.max(1, Number(r.qty) || 1),
      location: ['냉장','냉동','실온'].includes(r.location) ? r.location : '냉장',
      expiresAt: r.expiresAt ? String(r.expiresAt).slice(0, 10) : '',
      addedAt: r.addedAt || nowIso()
    };
  }
  function normShop(r, id){
    return {
      id,
      name: String(r.name || '').trim(),
      from: r.from ? String(r.from) : '삐클이',
      done: !!r.done,
      addedAt: r.addedAt || nowIso()
    };
  }

  /**
   * 원격 JSON 을 로컬에 합칩니다. (원격이 더 최신일 때만)
   * - 같은 id: 세화가 원격 스냅샷 이후 직접 고친 항목은 그대로 두고, 아니면 원격 값으로 갱신
   * - 원격에만 있는 id: 새로 추가
   * - 원격이 보낸 적 있는 id 가 이번 원격에서 빠짐: 냉장고에서 빠진 것이므로 지움
   *   (세화가 방금 직접 고친 항목은 남김)
   * - 원격에 없던 로컬 id: 세화가 직접 넣은 항목이므로 유지
   * - 세화가 지운 id(deletedIds): 원격에 다시 나타나도 되살리지 않음
   */
  function mergeRemote(remote){
    if(!remote || typeof remote !== 'object') return false;
    const incoming = ts(remote.updatedAt);
    if(!incoming) return false;
    const s = read();
    if(ts(s.lastSyncedAt) >= incoming) return false;   // 이미 반영한 버전

    const seenAt = incoming;
    // 사용자의 로컬 수정이 원격 스냅샷보다 나중이면 그 항목은 그대로 둡니다.
    const deletedInv = new Set(s.deletedIds.inventory);
    const deletedShop = new Set(s.deletedIds.shopping);
    const seenInv = s.remoteSeen.inventory;
    const seenShop = s.remoteSeen.shopping;

    // 재고
    const inv = new Map(s.inventory.map(it => [it.id, it]));
    const incomingInv = Array.isArray(remote.inventory) ? remote.inventory : null;
    const incomingInvIds = new Set();
    (incomingInv || []).forEach(r => {
      if(!r || !r.name) return;
      const id = remoteId(r, 'ri');
      incomingInvIds.add(id);
      if(deletedInv.has(id)) return;
      const local = inv.get(id);
      if(local && (s.touched[id] || 0) > seenAt) return;   // 직접 고친 항목은 유지
      inv.set(id, normInv(r, id));
    });
    if(incomingInv){   // 원격이 보낸 적 있는 항목이 이번엔 빠졌다면 냉장고에서 빠진 것
      Object.keys(seenInv).forEach(id => {
        if(incomingInvIds.has(id)) return;
        if((s.touched[id] || 0) > seenAt) return;          // 방금 손댄 항목은 남김
        inv.delete(id);
      });
      s.remoteSeen.inventory = {};
      incomingInvIds.forEach(id => { s.remoteSeen.inventory[id] = true; });
    }
    s.inventory = Array.from(inv.values());

    // 장보기
    const shop = new Map(s.shopping.map(it => [it.id, it]));
    const incomingShop = Array.isArray(remote.shopping) ? remote.shopping : null;
    const incomingShopIds = new Set();
    (incomingShop || []).forEach(r => {
      if(!r || !r.name) return;
      const id = remoteId(r, 'rs');
      incomingShopIds.add(id);
      if(deletedShop.has(id)) return;
      const local = shop.get(id);
      if(local && (s.touched[id] || 0) > seenAt) return;
      shop.set(id, normShop(r, id));
    });
    if(incomingShop){
      Object.keys(seenShop).forEach(id => {
        if(incomingShopIds.has(id)) return;
        if((s.touched[id] || 0) > seenAt) return;
        shop.delete(id);
      });
      s.remoteSeen.shopping = {};
      incomingShopIds.forEach(id => { s.remoteSeen.shopping[id] = true; });
    }
    s.shopping = Array.from(shop.values());

    // 식단 (원격이 보내준 경우 그대로 사용)
    if(Array.isArray(remote.meals)) s.meals = remote.meals;

    s.lastSyncedAt = new Date(incoming).toISOString();
    write(s);
    return true;
  }

  async function fetchRemote(){
    try{
      if(typeof fetch !== 'function') return null;
      const res = await fetch(REMOTE_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if(!res || !res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  /** 원격 파일을 확인해 새 내용이 있으면 병합하고 화면 갱신 신호를 보냅니다. */
  async function syncRemote(){
    if(syncing) return syncing;
    const t = Date.now();
    if(t - lastCheck < CHECK_GAP) return false;
    lastCheck = t;
    syncing = (async () => {
      const remote = await fetchRemote();
      if(!remote) return false;
      const changed = mergeRemote(remote);
      if(changed) emit('remote');
      return changed;
    })();
    try{ return await syncing; } finally { syncing = null; }
  }

  // 저장 전후를 비교해 '지운 항목'과 '직접 고친 항목'을 기억해 둡니다.
  const invSig = x => [x.name, x.amount, x.qty, x.location, x.expiresAt].join('|');
  const shopSig = x => [x.name, x.from, !!x.done].join('|');
  function trackDiff(s, prevInv, prevShop, nextInv, nextShop){
    const del = s.deletedIds;
    const nextInvIds = new Set(nextInv.map(x => x.id));
    const nextShopIds = new Set(nextShop.map(x => x.id));
    const prevInvMap = new Map(prevInv.map(x => [x.id, invSig(x)]));
    const prevShopMap = new Map(prevShop.map(x => [x.id, shopSig(x)]));
    prevInv.forEach(x => { if(!nextInvIds.has(x.id)) del.inventory.push(x.id); });
    prevShop.forEach(x => { if(!nextShopIds.has(x.id)) del.shopping.push(x.id); });
    nextInv.forEach(x => {
      if(!prevInvMap.has(x.id) || prevInvMap.get(x.id) !== invSig(x)) markTouch(s, x.id);
    });
    nextShop.forEach(x => {
      if(!prevShopMap.has(x.id) || prevShopMap.get(x.id) !== shopSig(x)) markTouch(s, x.id);
    });
    del.inventory = Array.from(new Set(del.inventory)).slice(-TOMB_MAX);
    del.shopping  = Array.from(new Set(del.shopping)).slice(-TOMB_MAX);
  }

  return {
    /** @returns {{inventory:Array, shopping:Array, meals:Array, updatedAt:string, lastSyncedAt:string}} */
    async load(){
      try{ await syncRemote(); }catch(e){ /* 오프라인 등 — 로컬만 사용 */ }
      return read();
    },
    async saveInventory(list){
      const s = read();
      trackDiff(s, s.inventory, s.shopping, list, s.shopping);
      s.inventory = list; write(s); emit();
    },
    async saveShopping(list){
      const s = read();
      trackDiff(s, s.inventory, s.shopping, s.inventory, list);
      s.shopping = list; write(s); emit();
    },
    /** 재고·장보기를 한 번에 저장 (중간 상태가 다른 기기로 새지 않도록) */
    async saveAll(inventory, shopping){
      const s = read();
      trackDiff(s, s.inventory, s.shopping, inventory, shopping);
      s.inventory = inventory; s.shopping = shopping; write(s); emit();
    },
    async setQty(id, qty){
      const s = read();
      const it = s.inventory.find(x => x.id === id);
      if(!it) return;
      it.qty = qty;
      markTouch(s, id);
      write(s); emit();
    },
    async removeItem(id){
      const s = read();
      s.inventory = s.inventory.filter(x => x.id !== id);
      s.deletedIds.inventory = Array.from(new Set(s.deletedIds.inventory.concat(id))).slice(-TOMB_MAX);
      write(s); emit();
    },
    subscribe(fn){ listeners.push(fn); return () => { listeners = listeners.filter(f => f !== fn); }; },
    /** 원격 data/fridge.json 확인 (앱 열 때·화면 복귀 시·주기적으로 호출) */
    syncFromRemote: () => { lastCheck = 0; return syncRemote(); },
    refresh: () => emit('local')
  };
})();

/* ---------- 데이터 로드 & 구독 ---------- */
function normalizeMeals(list){
  if(!Array.isArray(list)) return [];
  return list
    .filter(m => m && Array.isArray(m.ing) && m.ing.length)
    .map(m => ({
      emo: m.emo || '🍽️',
      day: m.day || '',
      kids: String(m.kids || m.adult || '오늘의 메뉴'),
      adult: String(m.adult || m.kids || ''),
      ing: m.ing.filter(g => g && g.name).map(g => ({ key: g.key || g.name, name: String(g.name) })),
      time: m.time ? String(m.time) : '',
      steps: Array.isArray(m.steps) ? m.steps.map(String) : [],
      tip: m.tip ? String(m.tip) : ''
    }))
    .filter(m => m.ing.length);
}
function applyState(s){
  state.inventory = Array.isArray(s.inventory) ? s.inventory : [];
  state.shopping = Array.isArray(s.shopping) ? s.shopping : [];
  MEALS = normalizeMeals(s.meals);
  const a = Date.parse(s.lastSyncedAt || '') || 0;
  const b = Date.parse(s.updatedAt || '') || 0;
  setSyncText(new Date(Math.max(a, b) || Date.now()).toISOString());
}

async function boot(){
  const s = await StorageAdapter.load();
  applyState(s);
  renderAll();
  StorageAdapter.subscribe(async (reason) => {
    const t = await StorageAdapter.load();
    applyState(t);
    renderAll();
    if(reason === 'remote') toast('새로 올라온 냉장고 정보를 불러왔어요');
  });
  // 화면으로 돌아오거나 앱을 다시 열 때 원격 데이터를 확인합니다.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') StorageAdapter.syncFromRemote();
  });
  window.addEventListener('focus', () => StorageAdapter.syncFromRemote());
}
function setSyncText(iso){
  const el = $('#syncText');
  if(!iso){ el.textContent = '방금 동기화됨'; return; }
  const diff = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if(diff < 60) el.textContent = '방금 동기화됨';
  else if(diff < 3600) el.textContent = `${Math.floor(diff/60)}분 전 동기화`;
  else el.textContent = '오늘 동기화됨';
}

/* ---------- 냉장고 탭 ---------- */
function filteredInventory(){
  let list = state.inventory.slice();
  if(state.loc !== '전체') list = list.filter(i => i.location === state.loc);
  const q = state.query.trim().toLowerCase();
  if(q) list = list.filter(i => i.name.toLowerCase().includes(q));
  if(state.statFilter !== 'all'){
    list = list.filter(i => {
      const n = dday(i.expiresAt);
      if(n === null) return false;
      return state.statFilter === 'soon' ? (n >= 0 && n <= 3) : (n < 0);
    });
  }
  if(state.sort === 'expiry'){
    list.sort((a,b) => (dday(a.expiresAt) ?? 9999) - (dday(b.expiresAt) ?? 9999));
  }else{
    list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  }
  return list;
}

function expiryClass(n){
  if(n === null) return 'green';
  if(n < 0) return 'expired';
  if(n <= 3) return 'red';
  if(n <= 7) return 'amber';
  return 'green';
}

function renderFridge(){

/* ---------- 식단 탭 ---------- */
// 재료 별칭 (같은 재료를 다르게 부르는 경우)
const ALIAS = {
  '계란': ['계란','달걀','유정란','왕란'],
  '두부': ['두부'],
  '순두부': ['순두부'],
  '만두': ['만두'],
  '김치': ['김치'],
  '우유': ['우유'],
  '김': ['김가루','김'],
  '치즈': ['치즈'],
  '닭가슴살': ['닭가슴살'],
  '다짐육': ['다짐육','소고기','한우'],
  '토마토': ['토마토'],
  '요거트': ['요거트','요구르트'],
};
function haystack(){ return state.inventory.map(i => i.name.replace(/\s/g,'').toLowerCase()); }
// 냉장고 품목명이 재료 이름을 포함하면 '보유'로 판단 (긴 이름이 짧은 이름에 끌려가지 않도록 단방향만)
function hasIngredient(key){
  const names = haystack();
  const keys = (ALIAS[key] || [key]).map(k => k.replace(/\s/g,'').toLowerCase());
  return keys.some(k => names.some(n => n.includes(k)));
}
function mealMatch(meal){
  const have = [], need = [];
  meal.ing.forEach(g => (hasIngredient(g.key) ? have : need).push(g));
  return { have, need, ratio: have.length / meal.ing.length };
}

function renderMeals(){
  if(!MEALS.length){
    $('#weekStrip').innerHTML = '';
    $('#weekStrip').hidden = true;
    $('#mealList').innerHTML = `<div class="empty">
      <div class="emo">${EMPTY_ICON.meal}</div>
      <b>아직 추천된 식단이 없어요</b>
      <p>냉장고에 재료가 채워지면<br/>딱 맞는 일주일 식단을 추천해 드려요</p>
    </div>`;
    return;
  }
  $('#weekStrip').hidden = false;
  const t = today0();
  const dow = (t.getDay() + 6) % 7;            // 0 = 월요일
  const ordered = Array.from({length:7}, (_, i) => {
    const idx = (dow + i) % 7;
    return { idx, date: addDays(t, i), meal: MEALS[idx] };
  });

  // 주간 스트립 (오늘부터 7일)
  $('#weekStrip').innerHTML = ordered.map((o, i) => `
    <div class="day-pill ${i===0?'today':''}">
      <div class="d">${WD[o.date.getDay()]}</div>
      <div class="n">${o.date.getDate()}</div>
    </div>`).join('');

  $('#mealList').innerHTML = ordered.map((o, i) => {
    const m = o.meal, idx = o.idx;
    const { have, need, ratio } = mealMatch(m);
    const pct = Math.round(ratio * 100);
    const open = state.expanded.has(idx);
    return `<article class="meal ${open?'open':''} ${i===0?'today':''}" data-idx="${idx}">
      <button class="meal-head" data-act="toggle">
        <div class="day-badge"><span class="d">${WD[o.date.getDay()]}</span><span class="dt">${shortDate(ymd(o.date))}</span></div>
        <div class="meal-main">
          <div class="meal-kids"><span class="menu-emo" aria-hidden="true">${m.emo || '🍽️'}</span><span>${esc(m.kids)}</span></div>
          <div class="meal-adult"><span class="tag">어른</span>${esc(m.adult)}</div>
        </div>
        <div class="meal-side">
          <span class="match-badge ${pct<60?'low':''}">재료 ${have.length}/${m.ing.length}</span>
          <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></span>
        </div>
      </button>
      <div class="meal-body">
        <div class="ing-block">
          <p class="ing-title">보유 재료 ${have.length} · 추가 필요 ${need.length}</p>
          <div class="ing-row">
            ${have.map(g => `<span class="ing have">${esc(g.name)}</span>`).join('')}
            ${need.map(g => `<span class="ing need">${esc(g.name)}</span>`).join('')}
          </div>
        </div>
        <div class="divider"></div>
        <p class="ing-title">조리 순서 · 약 ${esc(m.time)}</p>
        <ol class="steps">${m.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
        <div class="meal-tip"><span>💡</span><span>${esc(m.tip)}</span></div>
        <div class="meal-foot">
          <button class="btn-soft" data-act="add-need" ${need.length===0?'disabled style="opacity:.5"':''}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            부족한 재료 장보기 담기${need.length?` (${need.length})`:''}
          </button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ---------- 장보기 탭 ---------- */
function renderShop(){
  const items = state.shopping;
  const pending = items.filter(i => !i.done);
  const doneCount = items.length - pending.length;

  const row = (it) => `<div class="shop-row ${it.done?'checked':''}" data-id="${it.id}">
      <button class="check" data-act="toggle" aria-label="체크">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
      </button>
      <span class="shop-name">${esc(it.name)}</span>
      ${it.from ? `<span class="shop-from">${esc(it.from)}</span>` : ''}
      <button class="shop-del" data-act="del" aria-label="삭제">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>`;

  let html = '';
  if(items.length){
    html = `<section class="shop-group">
      <h3>살 것 <span>${pending.length}개 남음${doneCount?` · 담은 것 ${doneCount}`:''}</span></h3>
      <div class="shop-card">${items.map(row).join('')}</div>
    </section>`;
  }else{
    html = `<div class="empty">
      <div class="emo">${EMPTY_ICON.cart}</div>
      <b>장보기 메모가 비어 있어요</b>
      <p>위 입력창에 살 것을 적으면<br/>바로 담깁니다</p>
    </div>`;
  }
  $('#shopList').innerHTML = html;

  // 배지 / 이동 바 (체크한 = 담은 것)
  const badge = $('#shopBadge');
  if(pending.length){ badge.hidden = false; badge.textContent = pending.length; } else badge.hidden = true;
  $('#moveLabel').textContent = `선택 ${doneCount}개 냉장고로 옮기기`;
  $('#shopBar').classList.toggle('show', doneCount > 0 && state.tab === 'shop');
}

$('#invList').addEventListener('click', async e => {

  const id = card.dataset.id;
  const item = state.inventory.find(i => i.id === id);
  if(!item) return;
  const act = btn.dataset.act;

  if(act === 'inc'){ await StorageAdapter.setQty(id, item.qty + 1); }
  if(act === 'dec'){ await StorageAdapter.setQty(id, Math.max(1, item.qty - 1)); }

    card.classList.add('done');
    card.style.transition = 'opacity .25s ease, transform .25s ease';
    card.style.transform = 'translateX(12px)';
    card.style.opacity = '0';
    setTimeout(async () => {
      await StorageAdapter.removeItem(id);
      toast(`<b>${esc(item.name)}</b> 냉장고에서 뺐어요`);
    }, 220);
  }
});

/* ---------- 식단 이벤트 ---------- */
$('#mealList').addEventListener('click', async e => {
  const host = e.target.closest('.meal');
  if(!host) return;
  const idx = Number(host.dataset.idx);
  const actEl = e.target.closest('[data-act]');
  if(!actEl) return;
  const act = actEl.dataset.act;

  if(act === 'toggle'){
    if(state.expanded.has(idx)) state.expanded.delete(idx); else state.expanded.add(idx);
    renderMeals();
  }
  if(act === 'add-need'){
    const { need } = mealMatch(MEALS[idx]);
    if(!need.length) return;
    const norm = (s) => s.replace(/\s/g,'').replace(/[0-9]+.*$/,'').toLowerCase();
    const existing = new Set(state.shopping.map(s => norm(s.name)));
    const added = [];
    need.forEach(g => {
      const k = norm(g.name);
      if(existing.has(k)) return;
      existing.add(k);
      state.shopping.push({ id: uid(), name: g.name, from: (MEALS[idx].day ? `${MEALS[idx].day}요일 식단` : '추천 식단'), done:false, addedAt: new Date().toISOString() });
      added.push(g.name);
    });
    if(added.length){
      await StorageAdapter.saveShopping(state.shopping);
      const badge = $('#shopBadge');
      toast(`장보기에 <b>${added.length}개</b> 담았어요`);
    }else{
      toast('이미 장보기에 다 담겨 있어요');
    }
  }
});

/* ---------- 장보기 이벤트 ---------- */
$('#shopList').addEventListener('click', async e => {
  const rowEl = e.target.closest('.shop-row');
  if(!rowEl) return;
  const id = rowEl.dataset.id;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(!act) return;

  if(act === 'toggle'){
    const it = state.shopping.find(s => s.id === id);
    if(!it) return;
    it.done = !it.done;
    await StorageAdapter.saveShopping(state.shopping);
    renderShop();
  }
  if(act === 'del'){
    state.shopping = state.shopping.filter(s => s.id !== id);
    await StorageAdapter.saveShopping(state.shopping);
    renderShop();
  }
});

$('#shopInput').addEventListener('keydown', e => {

/* ---------- 장보기 → 냉장고 ---------- */
function guessLocation(name){
  if(/만두|아이스|냉동|닭가슴살|삼겹살|소고기|불고기|다짐육/.test(name)) return '냉동';
  if(/양파|상추|무|당근|양배추|감자|마늘|김가루|라면|즉석밥|간장|소금|기름|양념|쌀/.test(name)) return '실온';
  return '냉장';
}
function defaultShelfDays(name){
  if(/상추|양상추|시금치|깻잎|채소/.test(name)) return 5;
  if(/두부|우유|생크림|요거트/.test(name)) return 7;
  if(/고기|삼겹살|닭|소고기|다짐육/.test(name)) return 30;
  if(/양파|무|당근|감자/.test(name)) return 14;
  if(/간장|양념|소금|김가루|즉석밥/.test(name)) return 120;
  return 7;
}
$('#moveBtn').addEventListener('click', () => {
  const items = state.shopping.filter(i => i.done);
  if(!items.length) return;
  state.pendingMove = items.map(it => ({
    id: it.id,
    name: it.name,
    location: guessLocation(it.name),
    expiresAt: ymd(addDays(today0(), defaultShelfDays(it.name)))
  }));
  $('#moveList').innerHTML = state.pendingMove.map((m, i) => `<div class="move-row" data-i="${i}">
    <div class="top"><span class="nm">${esc(m.name)}</span>
      <div class="ctrls">
        <select data-f="location">
          ${['냉장','냉동','실온'].map(l => `<option ${l===m.location?'selected':''}>${l}</option>`).join('')}
        </select>
        <input type="date" data-f="expiresAt" value="${m.expiresAt}" />
      </div>
    </div>
  </div>`).join('');
  openSheet('#moveSheet');
});
$('#moveList').addEventListener('change', e => {
  const f = e.target.dataset.f; if(!f) return;
  const row = e.target.closest('.move-row');
  const i = Number(row.dataset.i);
  state.pendingMove[i][f] = e.target.value;
});
$('#moveConfirm').addEventListener('click', async () => {
  const moved = state.pendingMove.slice();
  if(!moved.length){ closeSheets(); return; }
  const nextInventory = state.inventory.slice();
  moved.forEach(m => {
    nextInventory.push({
      id: uid(), name: m.name, amount: '', qty: 1, location: m.location,
      expiresAt: m.expiresAt, addedAt: new Date().toISOString()
    });
  });
  const ids = new Set(moved.map(m => m.id));
  const nextShopping = state.shopping.filter(s => !ids.has(s.id));
  state.pendingMove = [];
  await StorageAdapter.saveAll(nextInventory, nextShopping);
  closeSheets();
  toast(`<b>${moved.length}개</b> 냉장고로 옮겼어요`);
  renderAll();
});

// 30초마다 "동기화" 표기 갱신 + 날짜 넘어가면 D-day 재계산
setInterval(async () => {
  const s = await StorageAdapter.load();
  const a = Date.parse(s.lastSyncedAt || '') || 0;
  const b = Date.parse(s.updatedAt || '') || 0;
  setSyncText(new Date(Math.max(a, b) || Date.now()).toISOString());
  renderFridge();
}, 30000);
</script>
